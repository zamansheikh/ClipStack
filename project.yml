name: ClipStack
options:
  bundleIdPrefix: com.zamansheikh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  ClipStack:
    type: application
    platform: macOS
    sources:
      - ClipStack
    dependencies:
      - package: GRDB
        product: GRDB
      - package: KeyboardShortcuts
    # Signing lives in the xcconfig so a git-ignored local file can supply a
    # real certificate (see Config/Signing.xcconfig).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    # Keys the generated Info.plist can't express (arrays). XcodeGen writes
    # this file on `xcodegen generate`; Xcode merges it with the
    # INFOPLIST_KEY_* settings below.
    info:
      path: Config/Info.plist
      properties:
        NSLocalNetworkUsageDescription: ClipStack shares your clipboard with your paired phone and computers on the same Wi-Fi network.
        NSBonjourServices:
          - _clipstack._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zamansheikh.ClipStack
        MARKETING_VERSION: 0.4.2
        CURRENT_PROJECT_VERSION: 4
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
